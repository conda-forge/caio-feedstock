schema_version: 1

context:
  version: "0.12.5"

package:
  name: caio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/caio/caio-${{ version }}.tar.gz
  sha256: 3b28842db82f83dfc4d7a8578585d2ef792a9a889069b7f5e1bddab94d2d1605

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - pip
    - python
    - setuptools >=77
  run:
    - python

tests:
  - python:
      imports:
        - caio
      pip_check: true

about:
  summary: Asynchronous file IO for Linux Posix and Windows.
  license: Apache-2.0
  license_file: COPYING
  homepage: https://github.com/mosquito/caio

extra:
  recipe-maintainers:
    - thewchan
    - matthewfeickert
